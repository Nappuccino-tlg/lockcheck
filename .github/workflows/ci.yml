name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest --cov-fail-under=98

      - name: Check its own example migrations
        # The tool is the test: a rule that stops matching real Alembic output is worth
        # catching here rather than in somebody's deploy.
        run: |
          lockcheck tests/examples/safe
          ! lockcheck tests/examples/locking
