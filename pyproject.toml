[project]
name = "lockcheck"
version = "0.1.0"
description = "Find Alembic migrations that will lock a Postgres table, before they run."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Parham Roozmand" }]
keywords = ["alembic", "postgres", "postgresql", "migrations", "linter", "downtime", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies, on purpose. A linter that drags a dependency tree into a
# project's CI is one more thing to resolve, pin and upgrade, and this needs nothing
# beyond ast and argparse.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
lockcheck = "lockcheck.cli:main"

[project.urls]
Homepage = "https://github.com/Nappuccino-tlg/lockcheck"
Source = "https://github.com/Nappuccino-tlg/lockcheck"
Issues = "https://github.com/Nappuccino-tlg/lockcheck/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=lockcheck --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
